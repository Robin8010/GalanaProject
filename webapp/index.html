    <title>Galana</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>

  <!-- Client-side PDF text extraction -->
   
    <script>
        // Point pdf.js at its worker bundle (also from CDN)
        if (window["pdfjsLib"]) {
            window["pdfjsLib"].GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }
    </script>

    <!-- Client-side OCR for images (and scanned/image-only PDFs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "project1": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="project1"
        data-id="container"
        data-settings='{"id" : "project1"}'
        data-handle-validation="true"
    ></div>
</body>
